<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>本轮 EPICYCLE — 傅里叶绘图仪</title>
<style>
  :root {
    --bg: #07070A;
    --ink: #EDEAE3;
    --dim: rgba(237, 234, 227, .38);
    --dimmer: rgba(237, 234, 227, .22);
    --hair: rgba(237, 234, 227, .13);
    --accent: #5EEBFF;
    --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: "Space Grotesk", "Inter", ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    --serif: "Songti SC", "SimSun", "STSong", "Noto Serif SC", "STSong", serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .atmos {
    position: fixed; inset: 0; pointer-events: none; z-index: 3;
    background:
      radial-gradient(120% 90% at 50% 45%, rgba(94,235,255,.06) 0%, rgba(94,235,255,0) 55%),
      radial-gradient(90% 75% at 50% 110%, rgba(0,0,0,.9) 0%, rgba(0,0,0,0) 70%),
      radial-gradient(130% 110% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.85) 100%);
  }

  .noise {
    position: fixed; inset: -50%; z-index: 4; pointer-events: none;
    opacity: .16; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='.55'/></svg>");
  }

  .stage { position: fixed; inset: 0; }
  #ink, #circles { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .frame {
    position: fixed; inset: 18px; border: 1px solid var(--hair);
    z-index: 5; pointer-events: none;
  }
  .frame .tick { position: absolute; width: 11px; height: 11px; border: 1px solid rgba(237,234,227,.42); }
  .frame .tick.tl { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .frame .tick.tr { top: -1px; right: -1px; border-left: 0; border-bottom: 0; }
  .frame .tick.bl { bottom: -1px; left: -1px; border-right: 0; border-top: 0; }
  .frame .tick.br { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  .chrome {
    position: fixed; inset: 0; z-index: 6;
    padding: 44px 52px 120px;
    display: flex; flex-direction: column; justify-content: space-between;
    pointer-events: none;
  }
  .chrome a, .chrome input, .chrome button { pointer-events: auto; }

  header { display: flex; justify-content: space-between; align-items: flex-start; }

  .brand .mark { display: flex; align-items: baseline; gap: 12px; font-size: 26px; letter-spacing: .16em; }
  .brand .mark .cn { font-family: var(--serif); letter-spacing: .28em; }
  .brand .mark .lat {
    font-family: var(--mono); font-size: 9px; letter-spacing: .46em;
    color: var(--dim); transform: translateY(-6px);
  }
  .brand .sub {
    margin-top: 10px; font-family: var(--mono); font-size: 9px;
    letter-spacing: .30em; color: var(--dimmer); text-transform: uppercase;
  }

  .modes { display: flex; gap: 30px; align-items: flex-start; }
  .mode {
    display: flex; flex-direction: column; gap: 7px;
    font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--dimmer);
  }
  .mode .idx { font-family: var(--mono); font-size: 8px; letter-spacing: .2em; opacity: .7; }
  .mode .rule { height: 1px; width: 100%; background: transparent; }
  .mode.on { color: var(--ink); }
  .mode.on .rule { background: var(--accent); box-shadow: 0 0 12px rgba(94,235,255,.45); }

  footer { display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }

  .composer { max-width: 48vw; }
  .glyph-input {
    display: block; width: 100%; background: transparent; border: 0; outline: none;
    font-family: var(--serif); font-size: 78px; line-height: 1.08;
    height: 96px; color: var(--ink); letter-spacing: .04em;
    caret-color: var(--accent);
  }
  .glyph-input::placeholder { color: rgba(237,234,227,.13); }

  .meta {
    display: flex; align-items: center; gap: 14px; margin-top: 14px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .24em;
    color: var(--dim); text-transform: uppercase;
  }
  .meta .sep { width: 14px; height: 1px; background: var(--dimmer); }
  .meta .live { color: var(--accent); }

  .params { display: grid; gap: 17px; width: 214px; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; }
  .row .k { font-family: var(--mono); font-size: 8.5px; letter-spacing: .26em; color: var(--dim); text-transform: uppercase; }
  .row .v { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--ink); }

  input[type=range] {
    grid-column: 1 / -1; -webkit-appearance: none; appearance: none;
    width: 100%; height: 12px; background: transparent; margin-top: 3px; cursor: ew-resize;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--hair); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 1px; height: 11px; background: var(--accent); margin-top: -5px;
    box-shadow: 0 0 8px rgba(94,235,255,.7);
  }

  .faces { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: -2px; }
  .faces button {
    appearance: none; -webkit-appearance: none;
    background: transparent; border: 1px solid var(--hair);
    color: var(--dim); font-family: var(--serif); font-size: 14px;
    line-height: 1; height: 30px; cursor: pointer; padding: 0;
    transition: color .2s, border-color .2s, box-shadow .2s;
  }
  .faces button:hover { color: var(--ink); border-color: rgba(237,234,227,.3); }
  .faces button.on {
    color: var(--accent); border-color: rgba(94,235,255,.55);
    box-shadow: inset 0 0 12px rgba(94,235,255,.12), 0 0 10px rgba(94,235,255,.15);
  }

  .faces.two { grid-template-columns: repeat(2, 1fr); }

  .spectrum-wrap {
    position: fixed; left: 52px; right: 52px; bottom: 34px; z-index: 6;
    pointer-events: none; border-top: 1px solid rgba(237,234,227,.11); padding-top: 9px;
  }
  .spectrum-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono); font-size: 8px; letter-spacing: .28em;
    color: rgba(237,234,227,.30); text-transform: uppercase; margin-bottom: 8px;
  }
  #spectrum { display: block; width: 100%; height: 30px; }

  .hint {
    position: fixed; left: 52px; top: 50%; transform: translateY(-50%);
    z-index: 6; pointer-events: none;
    font-family: var(--mono); font-size: 8px; letter-spacing: .3em;
    color: rgba(237,234,227,.16); text-transform: uppercase; writing-mode: vertical-rl;
  }

  @media (max-width: 860px) {
    .chrome { padding: 26px 22px 104px; }
    .frame { inset: 10px; }
    .spectrum-wrap { left: 22px; right: 22px; bottom: 24px; }
    .params { display: none; }
    .composer { max-width: 84vw; }
    .glyph-input { font-size: 54px; height: 70px; }
    .brand { min-width: 0; }
    .brand .mark { font-size: 19px; gap: 9px; }
    .brand .mark .lat { font-size: 8px; letter-spacing: .3em; }
    .brand .sub { display: none; }
    .modes { flex: 0 0 auto; gap: 16px; }
    .mode { font-size: 9px; letter-spacing: .16em; }
    .spectrum-head span:last-child { display: none; }
    .hint { display: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="ink"></canvas>
    <canvas id="circles"></canvas>
  </div>

  <div class="atmos"></div>
  <div class="noise"></div>

  <div class="frame">
    <span class="tick tl"></span><span class="tick tr"></span>
    <span class="tick bl"></span><span class="tick br"></span>
  </div>

  <div class="chrome">
    <header>
      <div class="brand">
        <div class="mark">
          <span class="cn">本轮</span>
          <span class="lat">EPICYCLE</span>
        </div>
        <div class="sub">Fourier drawing instrument · 傅里叶绘图仪</div>
      </div>

      <nav class="modes">
        <div class="mode on">
          <span class="idx">01</span>
          <span>文字</span>
          <span class="rule"></span>
        </div>
        <div class="mode">
          <span class="idx">02</span>
          <span>图像</span>
          <span class="rule"></span>
        </div>
      </nav>
    </header>

    <footer>
      <div class="composer">
        <input id="txt" class="glyph-input" maxlength="10" value="永"
               spellcheck="false" autocomplete="off" placeholder="输入文字" />
        <div class="meta">
          <span id="count">01 / 10</span>
          <span class="sep"></span>
          <span id="vFace">宋体</span>
          <span class="sep"></span>
          <span class="live" id="status">● 解析中</span>
        </div>
      </div>

      <div class="params">
        <div class="row">
          <span class="k">Stroke</span><span class="v" id="vMode">分笔</span>
        </div>
        <div class="faces two" id="modeRow">
          <button data-m="multi" class="on">分笔</button>
          <button data-m="one">一笔</button>
        </div>
        <div class="row">
          <span class="k">Sound</span><span class="v" id="vSnd">关</span>
        </div>
        <div class="faces two" id="sndRow">
          <button data-s="off" class="on">静音</button>
          <button data-s="on">开声</button>
        </div>
        <div class="row">
          <span class="k">Type</span><span class="v" id="vF">宋体</span>
        </div>
        <div class="faces" id="faces">
          <button data-f="song" class="on">宋</button>
          <button data-f="hei">黑</button>
          <button data-f="deng">等</button>
          <button data-f="yuan">圆</button>
          <button data-f="kai">楷</button>
          <button data-f="xing">行</button>
          <button data-f="fourier">傅</button>
        </div>
        <div class="row">
          <span class="k">Circles</span><span class="v" id="vK">600</span>
          <input id="rK" type="range" min="60" max="1024" step="4" value="600" />
        </div>
        <div class="row">
          <span class="k">Speed</span><span class="v" id="vS">1.0×</span>
          <input id="rS" type="range" min="0.3" max="2.4" step="0.1" value="1" />
        </div>
      </div>
    </footer>
  </div>

  <div class="hint">drag to scrub · click to replay</div>

  <div class="spectrum-wrap">
    <div class="spectrum-head">
      <span>Spectrum · 频谱</span>
      <span id="kn">K = 600 / N = 1024</span>
    </div>
    <canvas id="spectrum"></canvas>
  </div>

  <script src="./data/fourier-font.js"></script>
  <script src="./data/one-stroke.js"></script>
  <script src="./js/geom.js"></script>
  <script src="./js/fourier.js"></script>
  <script src="./js/ink.js"></script>
  <script src="./js/audio.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
