<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>本轮 EPICYCLE — 视觉方向小样 01</title>
<style>
  :root {
    --bg: #07070A;
    --ink: #EDEAE3;
    --dim: rgba(237, 234, 227, .38);
    --dimmer: rgba(237, 234, 227, .22);
    --hair: rgba(237, 234, 227, .13);
    --accent: #5EEBFF;
    --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: "Space Grotesk", "Inter", ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "SimSun", "STSong", serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---------- atmosphere ---------- */
  .atmos {
    position: fixed; inset: 0; pointer-events: none; z-index: 3;
    background:
      radial-gradient(120% 90% at 50% 45%, rgba(94,235,255,.06) 0%, rgba(94,235,255,0) 55%),
      radial-gradient(90% 75% at 50% 110%, rgba(0,0,0,.9) 0%, rgba(0,0,0,0) 70%),
      radial-gradient(130% 110% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.85) 100%);
  }

  .noise {
    position: fixed; inset: -50%; z-index: 4; pointer-events: none;
    opacity: .16; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='.55'/></svg>");
  }

  /* ---------- stage ---------- */
  .stage { position: fixed; inset: 0; }

  #trail, #overlay {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }

  /* ---------- frame ---------- */
  .frame {
    position: fixed; inset: 18px; border: 1px solid var(--hair);
    z-index: 5; pointer-events: none;
  }
  .frame .tick {
    position: absolute; width: 11px; height: 11px;
    border: 1px solid rgba(237,234,227,.42);
  }
  .frame .tick.tl { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .frame .tick.tr { top: -1px; right: -1px; border-left: 0; border-bottom: 0; }
  .frame .tick.bl { bottom: -1px; left: -1px; border-right: 0; border-top: 0; }
  .frame .tick.br { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  .chrome {
    position: fixed; inset: 0; z-index: 6; pointer-events: none;
    padding: 44px 52px 120px;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  /* ---------- header ---------- */
  header { display: flex; justify-content: space-between; align-items: flex-start; }

  .brand .mark {
    display: flex; align-items: baseline; gap: 12px;
    font-size: 26px; letter-spacing: .16em; font-weight: 500;
  }
  .brand .mark .cn { font-family: var(--serif); letter-spacing: .28em; }
  .brand .mark .lat {
    font-family: var(--mono); font-size: 9px; letter-spacing: .46em;
    color: var(--dim); transform: translateY(-6px);
  }
  .brand .sub {
    margin-top: 10px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .30em;
    color: var(--dimmer); text-transform: uppercase;
  }

  .modes { display: flex; gap: 30px; align-items: flex-start; }

  .mode {
    display: flex; flex-direction: column; gap: 7px;
    font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--dimmer);
  }
  .mode .idx { font-family: var(--mono); font-size: 8px; letter-spacing: .2em; opacity: .7; }
  .mode .rule { height: 1px; width: 100%; background: transparent; }
  .mode.on { color: var(--ink); }
  .mode.on .rule { background: var(--accent); box-shadow: 0 0 12px rgba(94,235,255,.45); }

  /* ---------- footer ---------- */
  footer { display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }

  .composer { max-width: 46vw; }

  .field {
    display: flex; align-items: baseline; gap: 2px;
    height: 96px;
  }
  .field .glyph {
    font-family: var(--serif);
    font-size: 78px; line-height: 1;
    letter-spacing: .04em;
    color: var(--ink);
    font-weight: 400;
  }
  .caret {
    width: 1px; height: 62px; background: var(--accent);
    margin-left: 10px; transform: translateY(6px);
    animation: blink 1.15s steps(1, end) infinite;
  }
  @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }

  .meta {
    display: flex; align-items: center; gap: 14px; margin-top: 16px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .24em;
    color: var(--dim); text-transform: uppercase;
  }
  .meta .sep { width: 14px; height: 1px; background: var(--dimmer); }
  .meta .live { color: var(--accent); }

  /* ---------- parameters ---------- */
  .params { display: grid; gap: 15px; width: 214px; }

  .row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; }
  .row .k {
    font-family: var(--mono); font-size: 8.5px; letter-spacing: .26em;
    color: var(--dim); text-transform: uppercase;
  }
  .row .v { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--ink); }
  .row .track {
    grid-column: 1 / -1; height: 1px; background: var(--hair); position: relative;
    margin-top: 7px;
  }
  .row .track i {
    position: absolute; top: -2px; width: 1px; height: 5px;
    background: var(--ink); display: block;
  }
  .row .track .fill {
    position: absolute; left: 0; top: 0; height: 1px;
    background: linear-gradient(90deg, rgba(94,235,255,0), rgba(94,235,255,.75));
  }

  /* ---------- spectrum ---------- */
  .spectrum-wrap {
    position: fixed; left: 52px; right: 52px; bottom: 34px;
    z-index: 6; pointer-events: none;
    border-top: 1px solid rgba(237,234,227,.11);
    padding-top: 9px;
  }
  .spectrum-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono); font-size: 8px; letter-spacing: .28em;
    color: rgba(237,234,227,.30); text-transform: uppercase;
    margin-bottom: 8px;
  }
  #spectrum { display: block; width: 100%; height: 30px; }

  @media (max-width: 860px) {
    .chrome { padding: 26px 22px 104px; }
    .frame { inset: 10px; }
    .spectrum-wrap { left: 22px; right: 22px; bottom: 24px; }
    .params { display: none; }
    .composer { max-width: 84vw; }
    .field { height: 74px; }
    .field .glyph { font-size: 58px; }
    .caret { height: 46px; }
    .brand { min-width: 0; }
    .brand .mark { font-size: 19px; gap: 9px; }
    .brand .mark .lat { font-size: 8px; letter-spacing: .3em; }
    .brand .sub { display: none; }
    .modes { flex: 0 0 auto; gap: 16px; }
    .mode { font-size: 9px; letter-spacing: .16em; }
    .spectrum-head span:last-child { display: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="trail"></canvas>
    <canvas id="overlay"></canvas>
  </div>

  <div class="atmos"></div>
  <div class="noise"></div>

  <div class="frame">
    <span class="tick tl"></span><span class="tick tr"></span>
    <span class="tick bl"></span><span class="tick br"></span>
  </div>

  <div class="chrome">
    <header>
      <div class="brand">
        <div class="mark">
          <span class="cn">本轮</span>
          <span class="lat">EPICYCLE</span>
        </div>
        <div class="sub">Fourier drawing instrument · 傅里叶绘图仪</div>
      </div>

      <nav class="modes">
        <div class="mode on">
          <span class="idx">01</span>
          <span>文字</span>
          <span class="rule"></span>
        </div>
        <div class="mode">
          <span class="idx">02</span>
          <span>图像</span>
          <span class="rule"></span>
        </div>
      </nav>
    </header>

    <footer>
      <div class="composer">
        <div class="field">
          <span class="glyph">永</span>
          <span class="caret"></span>
        </div>
        <div class="meta">
          <span>01 / 10</span>
          <span class="sep"></span>
          <span>楷体 KAITI</span>
          <span class="sep"></span>
          <span class="live">● 绘制中</span>
        </div>
      </div>

      <div class="params">
        <div class="row">
          <span class="k">Circles</span><span class="v">256</span>
          <span class="track"><span class="fill" style="width:38%"></span><i style="left:38%"></i></span>
        </div>
        <div class="row">
          <span class="k">Samples</span><span class="v">1024</span>
          <span class="track"><span class="fill" style="width:64%"></span><i style="left:64%"></i></span>
        </div>
        <div class="row">
          <span class="k">Stroke</span><span class="v">1.2</span>
          <span class="track"><span class="fill" style="width:22%"></span><i style="left:22%"></i></span>
        </div>
      </div>
    </footer>
  </div>

  <div class="spectrum-wrap">
    <div class="spectrum-head">
      <span>Spectrum · 频谱</span>
      <span>K = 256 / N = 1024</span>
    </div>
    <canvas id="spectrum"></canvas>
  </div>

  <script src="./mockup.js"></script>
</body>
</html>
